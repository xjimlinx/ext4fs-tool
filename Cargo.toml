[package]
name = "ext4fs-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "ext4fs_tool"
path = "src/lib.rs"

[[bin]]
name = "ext4fs-tool"
path = "src/main.rs"

[[bin]]
name = "ext4fs-tool-gui"
path = "src/bin/ext4gui.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_extras = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 2
